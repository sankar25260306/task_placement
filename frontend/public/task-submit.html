<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InternMind AI · Submit task</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f3f7f4;color:#193026;font:16px system-ui,Segoe UI,Arial}.wrap{max-width:720px;margin:auto}.hero{background:#123d2d;color:#fff;padding:24px;border-radius:18px}.hero p{color:#d7e7de;line-height:1.5}.card{background:#fff;border:1px solid #dce7e0;border-radius:16px;padding:22px;margin-top:16px}label{display:block;font-weight:650;font-size:13px;margin:14px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd8d0;border-radius:10px;font:inherit}textarea{min-height:130px;resize:vertical}button{margin-top:16px;border:0;border-radius:10px;background:#176b4b;color:white;font-weight:700;padding:13px 16px;cursor:pointer}button:disabled{opacity:.55}.status{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f5;border-radius:10px;padding:12px;margin-top:14px}.muted{color:#617168;font-size:13px;line-height:1.5}</style></head><body><main class="wrap"><header class="hero"><h1>Submit your task</h1><p>Share your repository URL, implementation notes, and evidence. Your submission is linked to your private InternMind review invitation.</p></header><section class="card"><p class="muted" id="taskInfo">Checking your private link…</p><form id="form"><label for="repo">GitHub / repository URL</label><input id="repo" type="url" placeholder="https://github.com/yourname/project"><label for="notes">Implementation notes</label><textarea id="notes" placeholder="Explain what you built, how to run it, and tests performed."></textarea><label for="evidence">Evidence (optional JSON)</label><textarea id="evidence" placeholder='{"tests":"5 passed","demo":"https://..."}'></textarea><button id="send" type="submit">Submit work</button></form><div id="status" class="status" aria-live="polite"></div></section></main><script>
const API=localStorage.getItem('internmind_api_url')||'http://127.0.0.1:8000';const p=new URLSearchParams(location.search);const taskId=Number(p.get('task_id')||0);const token=p.get('join_token')||'';const $=id=>document.getElementById(id);$('taskInfo').textContent=taskId&&token?`Task ID: TASK-${String(taskId).padStart(4,'0')} · Private submission link`:'This link is incomplete. Open the submission link from your latest task email.';
$('form').onsubmit=async e=>{e.preventDefault();if(!taskId||!token){$('status').textContent='Invalid submission link.';return}let evidence={};try{const raw=$('evidence').value.trim();if(raw)evidence=JSON.parse(raw)}catch{$('status').textContent='Evidence must be valid JSON, or leave it empty.';return}const body={repository_url:$('repo').value.trim(),notes:$('notes').value.trim(),evidence};if(!body.repository_url&&!body.notes&&!Object.keys(evidence).length){$('status').textContent='Add a repository URL, notes, or evidence.';return}$('send').disabled=true;$('status').textContent='Submitting…';try{const r=await fetch(`${API}/autonomous/tasks/${taskId}/submit?join_token=${encodeURIComponent(token)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.detail||`Request failed (${r.status})`);$('status').textContent=`Submission received. Version ${d.version}.\nNext step: open your AI interview room:\n${d.interview_url}`;$('form').reset()}catch(err){$('status').textContent='Submission failed: '+err.message}finally{$('send').disabled=false}};
</script></body></html>
